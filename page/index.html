<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    /* Größen aus Hostwerks Design-Skala (mit Rückfall für ältere Hostwerk-Versionen) */
    .machine { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--sp-3, 12px); margin: var(--sp-3, 12px) 0 var(--sp-5, 20px); }
    .small-v { font-size: var(--fs-md, 14px); line-height: 1.3; }
    .svc { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: var(--sp-3, 12px); margin-bottom: var(--sp-3, 12px); }
    .group-title { margin: 0 0 var(--sp-2, 8px); font-size: var(--fs-md, 14px); }
    .share { display: inline-flex; align-items: center; gap: var(--sp-2, 8px); min-height: 24px; }
    @media print { .no-print { display: none; } .card { break-inside: avoid; } }
  </style>
</head>
<body>
  <div class="row">
    <div class="grow"><p class="muted" id="stamp" aria-live="polite"></p></div>
    <div class="row no-print" style="flex-wrap: wrap">
      <label class="share small"><input type="checkbox" id="noAddr"> <span data-i18n="noAddr"></span></label>
      <button type="button" class="btn" id="copy" data-i18n="copy">Copy as text</button>
      <button type="button" class="btn" id="json" data-i18n="json">Copy as JSON</button>
      <button type="button" class="btn primary" id="print" data-i18n="print" data-i18n-title="printHint">Print / PDF</button>
    </div>
  </div>
  <div class="machine" id="machine"><div class="hw-skeleton" style="height: calc(var(--sp-8, 32px) * 2.5)"></div></div>
  <div class="svc" id="services"></div>
  <div class="svc" id="extra"></div>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
