<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    .machine { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 14px 0 18px; }
    .small-v { font-size: 15px; line-height: 1.3; }
    .svc { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    @media print { .no-print { display: none; } .hw-card { break-inside: avoid; } }
  </style>
</head>
<body>
  <div class="hw-row">
    <div class="hw-grow"><h1 data-i18n="title"></h1><p class="hw-sub" id="stamp"></p></div>
    <div class="hw-row no-print"><button class="hw-btn" id="copy" data-i18n="copy"></button><button class="hw-btn hw-primary" id="print" data-i18n="print"></button></div>
  </div>
  <div class="machine" id="machine"><div class="hw-skeleton" style="height:80px"></div></div>
  <div class="svc" id="services"></div>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
